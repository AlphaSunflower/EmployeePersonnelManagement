spring:
  application:
    name: EmployeePersonnelManagement
  datasource:
    url: jdbc:mysql://localhost:3306/employee_personnel?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:group18-employee-management-secret-key-2026}
  expiration: 86400000

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-shanghai.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:LTAI5tSm87xve5s3KV5TDD7j}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:9l2Ywn9obeXYFidZ4bdNG43NbQlM9b}
    bucket-name: ${OSS_BUCKET_NAME:employee-person}

file:
  storage-type: ${STORAGE_TYPE:local}
  upload-dir: uploads

server:
  port: 8080
